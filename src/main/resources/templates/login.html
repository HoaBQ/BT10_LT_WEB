<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập & Đăng ký - JWT Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .auth-card {
            max-width: 460px;
            margin: 50px auto;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background: #fff;
        }
        .nav-pills .nav-link {
            color: #495057;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-4 auth-card">
        <!-- Navigation Tabs -->
        <ul class="nav nav-pills nav-fill mb-4" id="authTab">
            <li class="nav-item">
                <button class="nav-link active" id="tab-login-btn" type="button">Đăng nhập</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="tab-register-btn" type="button">Đăng ký</button>
            </li>
        </ul>

        <!-- ALERT MESSAGE BOX -->
        <div id="auth-alert" class="alert d-none" role="alert"></div>

        <!-- FORM LOGIN -->
        <div id="box-login">
            <form id="form-login" onsubmit="return false;">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email hoặc Username</label>
                    <input type="text" name="email" id="email" class="form-control" placeholder="admin@gmail.com hoặc admin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="123456" required autocomplete="current-password">
                </div>
                <button id="login" type="button" class="btn btn-primary w-100 py-2 fw-bold">Đăng nhập</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Chưa có tài khoản? </span>
                <a href="javascript:void(0)" id="link-to-register" class="text-decoration-none fw-bold">Đăng ký ngay</a>
            </div>
        </div>

        <!-- FORM REGISTER -->
        <div id="box-register" class="d-none">
            <form id="form-register" onsubmit="return false;">
                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" id="reg_fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" id="reg_username" class="form-control" placeholder="nguyenvana">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="reg_email" class="form-control" placeholder="vana@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" id="reg_password" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="new-password">
                </div>
                <button id="register" type="button" class="btn btn-success w-100 py-2 fw-bold">Tạo tài khoản</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Đã có tài khoản? </span>
                <a href="javascript:void(0)" id="link-to-login" class="text-decoration-none fw-bold">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
